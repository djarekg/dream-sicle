<mat-form-field>
  <mat-label>Year</mat-label>
  <mat-select
    [disabled]="disabled()"
    [multiple]="multiple()"
    [value]="value()"
    (valueChange)="onChange($event)">
    @for (year of years(); track year) {
      <mat-option [value]="year">{{ year }}</mat-option>
    }
  </mat-select>
</mat-form-field>
